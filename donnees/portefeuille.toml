previsions = ["P-20261124-1", "P-20261124-2", "P-20261125-1"]
declare = { depot = "strat-ge-business", fichier = "memoire/PROJETS.md", ligne = "Obligato" }
rejeu = "strat-ge-business"

[opportunite.criteres]
demande = { note = 4, nature = "mesuré", source = "Service Public F23106 : affichages obligatoires pour tout employeur", justification = "Obligation légale", verif = { url = "https://entreprendre.service-public.gouv.fr/vosdroits/F23106", contient = "Affichages ou diffusions obligatoires" } }
concurrence = { note = 3, nature = "mesuré", source = "Centre national du droit du travail : pack d'affichage vendu en ligne, vierge", justification = "Un marché qui paie déjà, avec des packs non personnalisés", verif = { url = "https://centre-national-droit-du-travail.fr/catalogue/affichages-obligatoires/pack-daffichage-obligatoire-nouvelle-edition-2026-avec-support-mural", contient = "Pack d'affichage obligatoire" } }
marge = { note = 4, nature = "calcul", source = "boutique/prix_marges.py : produit numérique, frais de paiement seuls", justification = "Coût marginal quasi nul" }
cac = { note = 2, nature = "hypothèse", source = "economie_unitaire.py, taux prudents non mesurés", justification = "LTV/CAC 0,19 en direct TPE, 1,41 par les cabinets" }
vitesse = { note = 1, nature = "hypothèse", source = "", justification = "10 envois le 24/11, aucune réponse encore possible" }
potentiel = { note = 3, nature = "hypothèse", source = "", justification = "Tout employeur concerné ; les cabinets multiplient la portée" }

[[opportunite.arret]]
libelle = "Au moins une réponse des cabinets contactés (alerte J+7 de la mère)"
indicateur = "reponses"
seuil = 1
sens = "min"
date = "2026-12-01"
si_echec = "Revoir l'objet et le canal avant toute relance groupée ; ne pas élargir la liste"

[[opportunite.arret]]
libelle = "Au moins 3 paiements dans les 30 jours suivant le premier envoi (D-20261124-1)"
