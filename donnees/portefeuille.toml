# Portefeuille de l'entreprise mère : une entrée par opportunité réellement engagée (au moins une offre ou un envoi).
#
# Règles (vérifiées par `python3 -m mere verifier`) :
# - six critères obligatoires, note entière de 0 à 5, nature « mesuré », « calcul » ou « hypothèse » ;
#   une note mesurée ou calculée cite sa source ; une donnée absente s'écrit note 0, nature hypothèse ;
# - une opportunité active ou en test a au moins un critère d'arrêt daté, fixé avant d'agir ;
# - aucun montant réel ici (dépôt public) : les montants viennent du prestataire de paiement, au privé.
#
# Statut mère : actif (on y met du temps) · test (on laisse courir un test déjà lancé jusqu'à son verdict,
# sans nouvel envoi) · gele · arrete.

[reglages]
devise = "eur"
# Les tiers dont une page peut prouver une note sont reconnus dans le code (mere/controles.py, TIERS_RECONNUS), pas
# ici : le producteur ne choisit pas lui-même ses contrôleurs.
montants_publics = ["39"]

# Prévisions dont le résultat saisi est confronté à une mesure de la mère (sinon il reste « déclaré par l'auteur »).
[reglages.indicateurs_previsions]
"P-20261123-2" = "ventes_payees"
"P-20261124-1" = "ventes_payees"
"P-20261125-1" = "ventes_payees"
"P-20261124-3" = "reponses"  # prix publics cités dans les libellés de prévision (pas des montants encaissés)

