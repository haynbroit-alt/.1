[[opportunite]]
id = "obligato"
nom = "Obligato, affichages obligatoires remplis pour vous"
module = "strat-ge-business"
statut = "actif"
responsable = "propriétaire (envois, relances) ; businessman (préparation)"
prochaine_action = "D-20261125-1 : créer le lien de paiement (propriétaire), 30 conversations directes du 27/11 au 03/12, appeler les 10 cabinets le 28/11 au lieu de les relancer par e-mail"
