name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: pipx run ruff check mere tests
      - name: Tests adversariaux
        run: python -m unittest discover -s tests -v
      - name: Portefeuille valide et sorties publiques sans fuite
        run: python -m mere verifier
